services:
  - type: web
    name: serein-booking-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: serein
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        value: rideravik47@gmail.com
